name: Update Filters
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Commit and push generated rules to the selected branch
        required: true
        type: boolean
        default: false
      allow_rule_count_anomaly:
        description: Allow publishing unusually large rule count changes
        required: true
        type: boolean
        default: false
  schedule:
  - cron: 0 1 * * *

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  SMARTDNS_PATH: /tmp/smartdns
  SMARTDNS_VERSION: Release48.1
  SMARTDNS_SHA256: 41e18ff27841495382e08ba7c126755e97e4ee543e41df9553fd00e65734c450
  SINGBOX_VERSION: 1.12.12
  MIHOMO_VERSION: 1.19.16
  BLACKLIST_DNS_CONCURRENCY: 300
  BLACKLIST_DNS_RETRIES: 1
  BLACKLIST_BATCH_SIZE: 30000

permissions:
  contents: write
  actions: write

jobs:
  Update_Filters:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gzip
          sudo timedatectl set-timezone "$TZ"
          python -m pip install --upgrade pip
          pip install --requirement requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s scripts/tests -v

      - name: Sync upstream whitelist
        run: |
          curl -fsSL "https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/white.txt" -o white_upstream.txt
          mkdir -p build
          python - << 'PY'
          upstream_domains = set()
          with open('white_upstream.txt', 'r', encoding='utf-8') as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith('#') and not line.startswith('!'):
                      upstream_domains.add(line)

          custom_domains = set()
          try:
              with open('sources/local/white2.txt', 'r', encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith('#') and not line.startswith('!'):
                          if line not in upstream_domains:
                              custom_domains.add(line)
          except FileNotFoundError:
              pass

          with open('white_final.txt', 'w', encoding='utf-8') as f:
              with open('white_upstream.txt', 'r', encoding='utf-8') as upstream:
                  f.write(upstream.read())
              if custom_domains:
                  f.write('\n# Custom whitelist entries\n')
                  for domain in sorted(custom_domains):
                      f.write(domain + '\n')
          PY
          if ! cmp -s white_final.txt "build/white.txt"; then
            mv white_final.txt "build/white.txt"
          else
            rm white_final.txt
          fi
          rm -f white_upstream.txt

      - name: Prepare sources and domain backup
        run: |
          python scripts/adblock.py --mode prepare --force

      - name: Setup SmartDNS
        run: |
          set -e
          mkdir -p "$SMARTDNS_PATH"

          max_attempts=5
          sleep_seconds=5

          for attempt in $(seq 1 $max_attempts); do
            echo "SmartDNS setup attempt ${attempt}/${max_attempts}"

            SMARTDNS_URL="https://github.com/pymumu/smartdns/releases/download/${SMARTDNS_VERSION}/smartdns-x86_64"
            echo "Downloading SmartDNS from: $SMARTDNS_URL"
            if wget --quiet --timeout=30 --tries=3 "$SMARTDNS_URL" -O "$SMARTDNS_PATH/smartdns" \
              && [ -s "$SMARTDNS_PATH/smartdns" ] \
              && echo "${SMARTDNS_SHA256}  ${SMARTDNS_PATH}/smartdns" | sha256sum --check --strict; then
              chmod +x "$SMARTDNS_PATH/smartdns"
              cp config/smartdns.conf "$SMARTDNS_PATH/smartdns.conf"
              nohup "$SMARTDNS_PATH/smartdns" -f -x -c "$SMARTDNS_PATH/smartdns.conf" > /dev/null 2>&1 &
              echo "SmartDNS started."
              break
            else
              echo "SmartDNS download failed or empty binary."
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "SmartDNS setup failed after ${max_attempts} attempts."
              exit 1
            fi

            echo "Retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
            sleep_seconds=$((sleep_seconds * 2))
          done

      - name: Wait for SmartDNS
        run: |
          python - <<'PY'
          import time
          import dns.message
          import dns.query
          import dns.rcode

          for i in range(60):
              try:
                  q = dns.message.make_query("example.com", "A")
                  r = dns.query.udp(q, "127.0.0.1", port=5053, timeout=2)
                  rcode = r.rcode()
                  rcode_text = dns.rcode.to_text(rcode)
                  if rcode == dns.rcode.NOERROR:
                      print("SmartDNS ready: rcode=%s" % rcode_text)
                      break
                  print("SmartDNS not ready: rcode=%s" % rcode_text)
                  time.sleep(1)
              except Exception as e:
                  print("SmartDNS not ready: exception=%s" % e)
                  time.sleep(1)
          else:
              log_path = "/tmp/smartdns/smartdns.log"
              try:
                  with open(log_path, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()[-200:]
                  print("SmartDNS log tail:")
                  print("".join(lines))
              except Exception as e:
                  print("SmartDNS log unavailable: %s" % e)
              raise SystemExit("SmartDNS not ready")
          PY

      - name: Generate blacklist and China list
        timeout-minutes: 240
        run: |
          python scripts/blacklist.py

      - name: Generate final rules
        id: update
        run: |
          python scripts/adblock.py --mode generate
          rm -rf scripts/__pycache__
          rm -rf scripts/app/__pycache__
          echo "message=chore(rules): update filters and blacklist [$(TZ='Asia/Shanghai' date +'%F %T%:z')]" >> $GITHUB_OUTPUT

      - name: Validate rule counts
        env:
          ALLOW_RULE_COUNT_ANOMALY: ${{ inputs.allow_rule_count_anomaly || 'false' }}
        run: |
          python scripts/validate_rule_counts.py

      - name: Compile Sing-Box filters
        run: |
          wget --quiet --timeout=30 --tries=3 https://github.com/SagerNet/sing-box/releases/download/v${{env.SINGBOX_VERSION}}/sing-box-${{env.SINGBOX_VERSION}}-linux-amd64.tar.gz
          tar -zxvf sing-box-${{env.SINGBOX_VERSION}}-linux-amd64.tar.gz
          chmod +x sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box
          ./sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box rule-set compile --output rules/adblocksingbox.srs     rules/adblocksingbox.json
          ./sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box rule-set compile --output rules/adblocksingboxlite.srs rules/adblocksingboxlite.json
          rm -rf sing-box*
      
      - name: Compile mihomo filters
        run: |
          wget --quiet --timeout=30 --tries=3 https://github.com/MetaCubeX/mihomo/releases/download/v${{env.MIHOMO_VERSION}}/mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}.gz
          gzip -d mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}.gz
          chmod +x mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}
          ./mihomo-linux-amd64-v${{env.MIHOMO_VERSION}} convert-ruleset domain yaml rules/adblockmihomo.yaml     rules/adblockmihomo.mrs
          ./mihomo-linux-amd64-v${{env.MIHOMO_VERSION}} convert-ruleset domain yaml rules/adblockmihomolite.yaml rules/adblockmihomolite.mrs
          rm -rf mihomo*

      - name: Validate public rule paths
        run: |
          python scripts/validate_public_rules.py
      
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-failure-${{ github.run_id }}
          path: |
            /tmp/smartdns/smartdns.log
            /tmp/smartdns/smartdns.conf
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push changes
        id: publish
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          set -e
          target_branch="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "${{ steps.update.outputs.message }}"

          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "Push attempt ${attempt}/${max_attempts}"
            if git push origin "HEAD:$target_branch"; then
              echo "Pushed successfully."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              git fetch --deepen=5 origin "$target_branch"
              git rebase "origin/$target_branch"
            fi
            sleep $((attempt * 5))
          done

          echo "Push failed after ${max_attempts} attempts."
          exit 1
  
  Refresh_CDN:
    needs: [ Update_Filters ]
    if: needs.Update_Filters.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements.txt
      
      - name: Refresh CDN Cache
        run: |
          python scripts/refreshcdn.py

  Delete_Workflow_Runs:
    needs: [ Refresh_CDN ]
    if: needs.Refresh_CDN.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date --utc --date='1 day ago' +'%Y-%m-%dT%H:%M:%SZ')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/runs?per_page=100" \
            --jq ".workflow_runs[5:][] | select(.created_at < \"$cutoff\") | .id" \
            | while read -r run_id; do
                echo "Deleting workflow run ${run_id}"
                gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --method DELETE
              done
